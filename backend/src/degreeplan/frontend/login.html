<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | EduNav 2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="integration.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><h1>EduNav 2.0</h1><span>Student Course Planner</span></div>
    </header>
    <main class="dashboard login-page">
        <section class="progress-card">
            <h2 id="loginHeading">Sign in</h2>
            <p>Use your student account or the account provided by your administrator.</p>
            <p id="registrationNotice" role="status"></p>
            <form id="loginForm" method="post" action="/api/v1/auth/login">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
                <button type="submit">Sign In</button>
            </form>
            <p id="loginError" role="alert"></p>
            <p><a id="registerLink" href="register.html" hidden>Create a student account</a></p>
            <p><a href="login.html?next=/admin.html">Administrator sign in</a></p>
        </section>
    </main>
    <script type="module" src="app.js"></script>
</body>
</html>
