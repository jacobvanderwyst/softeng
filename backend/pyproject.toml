[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "degreeplan-backend"
version = "1.0.0"
description = "Backend API for the student degree plan tool"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Limiter>=3.5,<4",
    "Flask-Cors>=5,<7",
    "SQLAlchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
degreeplan = ["migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["degreeplan"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["*/migrations/*/versions/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["src/degreeplan/migrations/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
